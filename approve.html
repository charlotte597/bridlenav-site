<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>BridleNav</title>
<!--
  Approving a rider's route.
  ---------------------------------------------------------------------------
  This page exists because Supabase will not serve a web page from an edge
  function - everything it returns arrives as plain text, so Charlotte saw the
  page's own source instead of the page. That is almost certainly deliberate on
  their part: letting anyone publish HTML on a trusted supabase.co address is
  how convincing fake sign-in pages get built.

  So the page lives here, on BridleNav's own site, and Supabase does the data.
  The link in the moderation email still points at the function; the function
  now simply bounces it here.

  NOTHING ON THIS PAGE CHANGES ANYTHING UNTIL A BUTTON IS PRESSED. Opening it
  only reads. That matters because a link in an email gets opened by mail
  scanners and link previewers, and the first version of this - which acted the
  moment the link was opened - silently rejected one of Ken's routes.
-->
<style>
  :root{ --bg:#2C3E2D; --card:#3A5C3A; --line:#4A7C4A; --ink:#F5F0E8; --soft:#C8D8C8;
         --meta:#A9C0A9; --gold:#C9A96E; --green:#5C8C5A; --amber:#E0B64A; --red:#C46A4E; }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--bg);color:var(--ink);padding:24px;
    font:16px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
  .card{width:100%;max-width:27rem;background:var(--card);border:1px solid var(--line);
    border-radius:16px;padding:26px}
  .mark{font-weight:700;letter-spacing:-.02em;margin-bottom:18px;font-size:1rem}
  .mark span{color:var(--gold)}
  h1{font-size:1.25rem;margin:0 0 6px;line-height:1.35}
  p{margin:0 0 10px;color:var(--soft);font-size:.95rem}
  .meta{font-size:.82rem;color:var(--meta);margin:0 0 4px}
  .flag{font-size:.82rem;font-weight:600;margin:14px 0 0;padding:10px 12px;border-radius:10px}
  .flag.ok{color:#9ED39B;background:rgba(158,211,155,.10);border:1px solid rgba(158,211,155,.35)}
  .flag.no{color:var(--amber);background:rgba(224,182,74,.10);border:1px solid rgba(224,182,74,.45)}
  .q{font-size:.95rem;font-weight:700;margin:22px 0 10px;color:var(--ink)}
  .areas{display:flex;flex-wrap:wrap;gap:8px}
  .areas input{position:absolute;opacity:0;pointer-events:none}
  .areas label{padding:9px 13px;border-radius:11px;border:1px solid var(--line);
    background:#243424;font-size:.86rem;font-weight:600;color:var(--soft);
    cursor:pointer;user-select:none}
  .areas input:checked + label{background:var(--gold);border-color:var(--gold);color:#243424}
  .areas label.thin{opacity:.6;font-style:italic}
  .other{margin-top:10px;width:100%;background:#243424;border:1px solid var(--line);
    border-radius:11px;padding:10px 12px;font-size:.9rem;color:var(--ink);font-family:inherit}
  .other::placeholder{color:#7E8A7E}
  button{width:100%;margin-top:20px;border:0;border-radius:12px;padding:14px;font-size:1rem;
    font-weight:700;font-family:inherit;cursor:pointer;color:var(--ink)}
  button:disabled{background:#334934;color:#7E8A7E;cursor:default}
  .go{background:var(--green)}
  .danger{background:var(--red);color:#fff}
  .quiet{display:block;margin-top:14px;text-align:center;font-size:.85rem;color:var(--red);
    font-weight:600;text-decoration:none;cursor:pointer;background:none;border:0;width:100%}
  .tick{font-size:2rem;margin-bottom:6px}
  .warn{color:var(--amber)}
  .good{color:#9ED39B}
  .bad{color:var(--red)}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="mark">Bridle<span>Nav</span></div>
  <p id="boot">Loading the route…</p>
</div>

<script>
(function () {
  var FN = 'https://xlvjhktfaiagtbdxaetn.supabase.co/functions/v1/moderate-route';
  var card = document.getElementById('card');
  var q = new URLSearchParams(location.search);
  var id = q.get('id') || '';
  var token = q.get('token') || '';
  var wanted = q.get('action') === 'reject' ? 'reject' : 'approve';

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function show(html) {
    card.innerHTML = '<div class="mark">Bridle<span>Nav</span></div>' + html;
  }
  function note(cls, heading, detail) {
    show('<h1 class="' + cls + '">' + esc(heading) + '</h1><p>' + esc(detail) + '</p>');
  }

  if (!id || !token) {
    note('warn', 'Something is missing',
      'That link is incomplete. Open the email again and tap the button rather than copying the address.');
    return;
  }

  // Reading only. The function refuses anything else without a form behind it.
  fetch(FN + '?mode=info&id=' + encodeURIComponent(id) + '&token=' + encodeURIComponent(token))
    .then(function (r) { return r.text(); })
    .then(function (t) { return JSON.parse(t); })
    .then(render)
    .catch(function () {
      note('warn', 'Could not reach the route',
        'Check your signal and open the link again. Nothing has been changed.');
    });

  function render(d) {
    if (d.error === 'denied') {
      return note('warn', 'Not allowed',
        'That link has been tampered with, or the moderation secret has changed. Nothing has been altered.');
    }
    if (d.error === 'missing') {
      return note('warn', 'Route not found',
        'That submission is no longer in the queue. It may have been deleted.');
    }
    if (d.status === 'approved' || d.status === 'rejected') {
      return note('good', 'Already decided',
        d.name + ' was ' + d.status + ' earlier. Nothing has changed.');
    }

    var bits = [];
    if (d.submitter_name) bits.push(d.submitter_name); else bits.push('not credited');
    if (d.track_points) bits.push(d.track_points + ' points');
    if (d.marked_points) bits.push(d.marked_points + ' marked');
    bits.push((d.photo_count || 0) + ' photos');
    var meta = bits.join(' · ');

    var where = esc(d.region || '');
    if (d.parking) where += (where ? ' — ' : '') + esc(d.parking);

    var confirmed = d.rights_confirmed_at
      ? '<p class="flag ok">✓ The rider confirmed any rider could follow this — nothing on it needs permission given to them personally.</p>'
      : '<p class="flag no">⚠ No rights-of-way confirmation on this one — it was shared before the tick existed, or not ticked. Worth asking before it goes out.</p>';

    if (wanted === 'reject') {
      show('<h1>Reject this route?</h1>'
        + '<p style="font-weight:700;color:var(--ink)">' + esc(d.name) + '</p>'
        + '<p class="meta">' + esc(meta) + '</p>'
        + '<p>It will not appear for riders. Nothing has changed yet.</p>'
        + '<button class="danger" id="doit">Yes, reject it</button>');
      document.getElementById('doit').onclick = function () { act('reject', null, this); };
      return;
    }

    var areas = (d.areas && d.areas.length) ? d.areas : ['Peak District', 'Yorkshire', 'North East'];
    var inUse = d.areas_in_use || [];
    var chips = areas.map(function (a, i) {
      var thin = inUse.indexOf(a) === -1 ? ' thin' : '';
      return '<input type="radio" id="a' + i + '" name="area" value="' + esc(a) + '">'
           + '<label for="a' + i + '" class="' + thin.trim() + '">' + esc(a) + '</label>';
    }).join('');

    show('<h1>' + esc(d.name) + '</h1>'
      + '<p class="meta">' + esc(meta) + '</p>'
      + (where ? '<p class="meta">' + where + '</p>' : '')
      + confirmed
      + '<p class="q">Which area does this belong in?</p>'
      + '<div class="areas">' + chips
      + '<input type="radio" id="aother" name="area" value="__other__">'
      + '<label for="aother" class="thin">Somewhere else…</label></div>'
      + '<input class="other" id="other" type="text" placeholder="…or type a new area" autocapitalize="words">'
      + '<button class="go" id="doit" disabled>Pick an area first</button>'
      + '<button class="quiet" id="rej">Reject this route instead</button>');

    var btn = document.getElementById('doit');
    var other = document.getElementById('other');

    function chosen() {
      var sel = card.querySelector('input[name="area"]:checked');
      if (!sel) return '';
      return sel.value === '__other__' ? other.value.trim() : sel.value;
    }
    function refresh() {
      var a = chosen();
      btn.disabled = !a;
      btn.textContent = a ? 'Approve and publish' : 'Pick an area first';
    }
    card.addEventListener('change', refresh);
    other.addEventListener('input', refresh);

    btn.onclick = function () { act('approve', chosen(), btn); };
    document.getElementById('rej').onclick = function () {
      wanted = 'reject';
      render(d);
    };
  }

  // The only thing on this page that changes anything.
  function act(action, area, btn) {
    btn.disabled = true;
    btn.textContent = 'Just a moment…';
    fetch(FN, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ id: id, token: token, action: action, area: area }),
    })
      .then(function (r) { return r.text(); })
      .then(function (t) { return JSON.parse(t); })
      .then(function (d) {
        if (d.result === 'approve') {
          return show('<div class="tick">🐴</div><h1 class="good">Published to ' + esc(d.area) + '</h1>'
            + '<p>' + esc(d.name) + ' is live for riders. It will show in Browse Routes straight away.</p>');
        }
        if (d.result === 'reject') {
          return show('<h1 class="bad">Rejected</h1><p>' + esc(d.name) + ' will not appear for riders.</p>');
        }
        if (d.result === 'already') {
          return note('good', 'Already decided', d.name + ' was ' + d.status + ' earlier. Nothing has changed.');
        }
        if (d.error === 'need-area') {
          return note('warn', 'Pick an area first',
            'A route needs an area before it can go live, otherwise it lands nowhere riders can find it.');
        }
        if (d.error === 'denied') {
          return note('warn', 'Not allowed',
            'That link has been tampered with, or the moderation secret has changed. Nothing has been altered.');
        }
        note('warn', 'That didn’t work', 'Nothing has been changed. Try the link again in a minute.');
      })
      .catch(function () {
        note('warn', 'That didn’t work', 'Nothing has been changed. Check your signal and try the link again.');
      });
  }
})();
</script>
</body>
</html>
